name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  lint-test-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pudimjobs_test
          POSTGRES_USER: pudimjobs
          POSTGRES_PASSWORD: pudimjobs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pudimjobs"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://pudimjobs:pudimjobs_test@localhost:5432/pudimjobs_test
      DATABASE_URL: postgresql+asyncpg://pudimjobs:pudimjobs_test@localhost:5432/pudimjobs_test
      REDIS_URL: redis://localhost:6380/0

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download spaCy model
        run: python -m spacy download en_core_web_sm

      - name: Lint with ruff
        run: ruff check .

      - name: Audit Python dependencies (pip-audit)
        run: |
          pip install pip-audit
          pip-audit

      - name: Run tests
        run: python -m pytest

      - name: Build Docker image
        run: docker build -t pudimjobs-backend .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: pudimjobs-backend
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH
