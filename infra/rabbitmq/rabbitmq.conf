# RabbitMQ broker settings for PudimJobs.
#
# Celery acknowledges a task only after it finishes (task_acks_late=True). If a
# task holds a delivery unacknowledged for longer than consumer_timeout,
# RabbitMQ closes the worker's channel and the worker loses its consumer,
# leaving the queue "ready" but never delivered. The default is 30 minutes,
# which a detail-heavy scrape used to exceed.
#
# Keep this above the worker's hard task time limit (SCRAPE_TASK_TIME_LIMIT_
# SECONDS, 25 minutes by default) so Celery fails the run first and records the
# failure on the ScrapeRun instead of the broker killing the consumer.
consumer_timeout = 7200000
