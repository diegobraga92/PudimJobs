services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pudimjobs
      POSTGRES_USER: pudimjobs
      POSTGRES_PASSWORD: pudimjobs_dev
    # Internal only — no host port. Reach it from the host with:
    #   docker compose exec postgres psql -U pudimjobs -d pudimjobs
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pudimjobs"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    # AMQP (5672) stays internal to the Docker network; only the management
    # console is exposed on a configurable host port.
    ports:
      - "${PJ_RABBITMQ_MGMT_PORT:-9672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: pudimjobs
      RABBITMQ_DEFAULT_PASS: pudimjobs_dev
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    # Internal only — no host port.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # Internal only — the frontend proxies /api to it over the Docker network.
    # Mounted at /app/backend so the layout matches the Dockerfile's
    # COPY backend/ ./backend/ (same as the worker services).
    volumes:
      - ./backend:/app/backend
      - ./api:/app/api
      - ./scrapers:/app/scrapers
    environment:
      DATABASE_URL: postgresql+asyncpg://pudimjobs:pudimjobs_dev@postgres:5432/pudimjobs
      RABBITMQ_URL: amqp://pudimjobs:pudimjobs_dev@rabbitmq:5672/
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: amqp://pudimjobs:pudimjobs_dev@rabbitmq:5672/
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      # /app covers the shared top-level packages mounted next to backend
      # (scrapers at /app/scrapers, api at /app/api).
      PYTHONPATH: /app/backend:/app
      LOG_LEVEL: DEBUG
      OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      # Comma-separated browser origins allowed to call the API directly.
      CORS_ORIGINS: "${PJ_CORS_ORIGINS:-http://localhost:9400,http://127.0.0.1:9400}"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: workers/Dockerfile
    volumes:
      - ./backend:/app/backend
      - ./workers:/app/workers
      - ./api:/app/api
      - ./scrapers:/app/scrapers
    environment:
      DATABASE_URL: postgresql+asyncpg://pudimjobs:pudimjobs_dev@postgres:5432/pudimjobs
      RABBITMQ_URL: amqp://pudimjobs:pudimjobs_dev@rabbitmq:5672/
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: amqp://pudimjobs:pudimjobs_dev@rabbitmq:5672/
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      PYTHONPATH: /app/backend:/app/workers:/app
      LOG_LEVEL: DEBUG
      OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      WORKER_METRICS_PORT: "9100"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build:
      context: .
      dockerfile: workers/Dockerfile
    volumes:
      - ./backend:/app/backend
      - ./workers:/app/workers
      - ./api:/app/api
      - ./scrapers:/app/scrapers
    environment:
      DATABASE_URL: postgresql+asyncpg://pudimjobs:pudimjobs_dev@postgres:5432/pudimjobs
      RABBITMQ_URL: amqp://pudimjobs:pudimjobs_dev@rabbitmq:5672/
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: amqp://pudimjobs:pudimjobs_dev@rabbitmq:5672/
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      PYTHONPATH: /app/backend:/app/workers:/app
      LOG_LEVEL: DEBUG
    command: celery -A workers.celery_app beat --loglevel=info
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  event-consumer:
    build:
      context: .
      dockerfile: workers/Dockerfile
    volumes:
      - ./backend:/app/backend
      - ./workers:/app/workers
      - ./api:/app/api
      - ./scrapers:/app/scrapers
    environment:
      DATABASE_URL: postgresql+asyncpg://pudimjobs:pudimjobs_dev@postgres:5432/pudimjobs
      RABBITMQ_URL: amqp://pudimjobs:pudimjobs_dev@rabbitmq:5672/
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: amqp://pudimjobs:pudimjobs_dev@rabbitmq:5672/
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      PYTHONPATH: /app/backend:/app/workers:/app
      LOG_LEVEL: DEBUG
    command: python -m workers.consume_events
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:latest
    # SMTP (1025) stays internal; only the web UI is exposed.
    ports:
      - "${PJ_MAILPIT_PORT:-9025}:8025"

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "${PJ_PROMETHEUS_PORT:-9409}:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana-oss:latest
    ports:
      - "${PJ_GRAFANA_PORT:-9300}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  jaeger:
    image: jaegertracing/all-in-one:latest
    # OTLP ingest (4318) stays internal; only the tracing UI is exposed.
    ports:
      - "${PJ_JAEGER_UI_PORT:-9668}:16686"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${PJ_FRONTEND_PORT:-9400}:4200"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data: