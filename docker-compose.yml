services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pudimjobs
      POSTGRES_USER: pudimjobs
      POSTGRES_PASSWORD: pudimjobs_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pudimjobs"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: pudimjobs
      RABBITMQ_DEFAULT_PASS: pudimjobs_dev
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./api:/app/api
      - ./scrapers:/app/scrapers
    environment:
      DATABASE_URL: postgresql+asyncpg://pudimjobs:pudimjobs_dev@postgres:5432/pudimjobs
      RABBITMQ_URL: amqp://pudimjobs:pudimjobs_dev@rabbitmq:5672/
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: amqp://pudimjobs:pudimjobs_dev@rabbitmq:5672/
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      PYTHONPATH: /app
      LOG_LEVEL: DEBUG
      OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: workers/Dockerfile
    volumes:
      - ./backend:/app/backend
      - ./workers:/app/workers
      - ./api:/app/api
      - ./scrapers:/app/scrapers
    environment:
      DATABASE_URL: postgresql+asyncpg://pudimjobs:pudimjobs_dev@postgres:5432/pudimjobs
      RABBITMQ_URL: amqp://pudimjobs:pudimjobs_dev@rabbitmq:5672/
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: amqp://pudimjobs:pudimjobs_dev@rabbitmq:5672/
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      PYTHONPATH: /app/backend:/app/workers:/app
      LOG_LEVEL: DEBUG
      OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      WORKER_METRICS_PORT: "9100"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build:
      context: .
      dockerfile: workers/Dockerfile
    volumes:
      - ./backend:/app/backend
      - ./workers:/app/workers
      - ./api:/app/api
      - ./scrapers:/app/scrapers
    environment:
      DATABASE_URL: postgresql+asyncpg://pudimjobs:pudimjobs_dev@postgres:5432/pudimjobs
      RABBITMQ_URL: amqp://pudimjobs:pudimjobs_dev@rabbitmq:5672/
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: amqp://pudimjobs:pudimjobs_dev@rabbitmq:5672/
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      PYTHONPATH: /app/backend:/app/workers:/app
      LOG_LEVEL: DEBUG
    command: celery -A workers.celery_app beat --loglevel=info
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  event-consumer:
    build:
      context: .
      dockerfile: workers/Dockerfile
    volumes:
      - ./backend:/app/backend
      - ./workers:/app/workers
      - ./api:/app/api
      - ./scrapers:/app/scrapers
    environment:
      DATABASE_URL: postgresql+asyncpg://pudimjobs:pudimjobs_dev@postgres:5432/pudimjobs
      RABBITMQ_URL: amqp://pudimjobs:pudimjobs_dev@rabbitmq:5672/
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: amqp://pudimjobs:pudimjobs_dev@rabbitmq:5672/
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      PYTHONPATH: /app/backend:/app/workers:/app
      LOG_LEVEL: DEBUG
    command: python -m workers.consume_events
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana-oss:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"
      - "4318:4318"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data: